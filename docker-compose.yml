name: react-starter-pack

services:
  web:
    build:
      context: .
      target: runtime
      args:
        # Baked into the build: the address the browser uses to reach the API
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    image: react-starter-pack-web
    container_name: react-starter-pack-web
    restart: unless-stopped
    # 5001 matches WEB_ORIGIN in the API's .env, which CORS and the refresh cookie need
    ports:
      - '5001:4173'
